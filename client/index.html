<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Task Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  />
</head>

<body>
  <div class="container">
    <h1>Task Dashboard</h1>

    <form id="taskForm">
      <input
        type="text"
        id="title"
        placeholder="Task Title"
        required
      />

      <textarea
        id="description"
        placeholder="Description"
      ></textarea>

      <select id="status">
        <option value="pending">
          Pending
        </option>

        <option value="in-progress">
          In Progress
        </option>

        <option value="completed">
          Completed
        </option>
      </select>

      <select id="priority">
        <option value="low">
          Low
        </option>

        <option value="medium">
          Medium
        </option>

        <option value="high">
          High
        </option>
      </select>

      <input
        type="text"
        id="category"
        placeholder="Category"
      />

      <button type="submit">
        Add Task
      </button>
    </form>

    <button id="logoutBtn">
      Logout
    </button>

    <div id="tasksContainer"></div>
  </div>

  <script src="./js/dashboard.js"></script>
</body>
</html>
